function sec(i){const s=S[i];app.innerHTML=`<div class="card"><h2>${s.e} ${s.n}</h2>${s.txt}</div><button class="g" style="width:100%" onclick="quiz(S[${i}].q,'${s.n}',false)">✏️ ابدأ ١٠ أسئلة</button><button style="width:100%;margin-top:10px" onclick="home()">🏠 الرئيسية</button>`;scrollTo(0,0)}
let Q,qi,sc,ttl,exam,nm;
function ask(){app.innerHTML=`<div class="card"><h2>🏆 الاختبار النهائي</h2><p>اكتب اسمك أولًا:</p><input id="nm" placeholder="الاسم"><br><br><button class="g" style="width:100%" onclick="nm=$('#nm').value.trim();if(!nm){alert('اكتب اسمك');return}quiz(E,'الاختبار النهائي',true)">▶️ ابدأ الاختبار</button></div>`}
function quiz(q,t,ex){Q=q;qi=0;sc=0;ttl=t;exam=ex;show()}
function show(){const q=Q[qi];app.innerHTML=`<div class="card"><div class="bar"><div style="width:${qi/Q.length*100}%"></div></div><p>${ttl} — سؤال ${qi+1} من ${Q.length} ⭐ ${sc}</p><h3>${q.q.replace(/</g,'&lt;')}</h3>${q.o.map((o,i)=>`<button class="o" onclick="pick(this,${i})">${o.replace(/</g,'&lt;')}</button>`).join('')}</div>`}
function pick(b,i){const q=Q[qi],bs=[...document.querySelectorAll('.o')];bs.forEach(x=>x.disabled=true);const r=q.o[i]===q.a;if(r){sc++;b.classList.add('ok');good();emo('😄')}else{b.classList.add('no');bad();emo('😢');bs.find(x=>x.textContent==q.a.replace(/</g,'<')).classList.add('ok')}
setTimeout(()=>{qi++;qi<Q.length?show():fin()},1300)}
function fin(){const p=Math.round(sc/Q.length*100),m=p>=85?'🌟 ممتاز! أنت مصمم مواقع محترف':p>=50?'👍 جيد، راجع الدرس وحاول مرة أخرى':'💪 لا تقلق! راجع الدرس وحاول من جديد';if(p>=50){good();emo('🎉')}
let w='';if(exam){const t=`🎓 منصة محترف\nالدرس السادس: أنا مصمم مواقع إنترنت\nالطالب: ${nm}\nالنتيجة: ${sc} من ${Q.length} (${p}%)`;w=`<button class="g" style="width:100%;margin-top:10px" onclick="window.open('https://wa.me/201099920517?text='+encodeURIComponent(${JSON.stringify(t)}))">📲 إرسال النتيجة إلى واتساب</button>`}
app.innerHTML=`<div class="card"><div class="big">${p>=50?'🏆':'📚'}</div><h2 style="text-align:center">${exam?nm+'، ':''}نتيجتك: ${sc} من ${Q.length}</h2><h3 style="text-align:center">${m}</h3>${w}<button style="width:100%;margin-top:10px" onclick="home()">🏠 الرئيسية</button></div>`;if(exam)setTimeout(()=>window.open('https://wa.me/201099920517?text='+encodeURIComponent(`🎓 منصة محترف\nالدرس السادس: أنا مصمم مواقع إنترنت\nالطالب: ${nm}\nالنتيجة: ${sc} من ${Q.length} (${p}%)`)),1500)}
